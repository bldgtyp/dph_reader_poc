# Ruff for the whole POC — `py/` and `tools/` alike, so a tool script is held to the same standard
# as the package. It lives here rather than in `py/pyproject.toml` because a config nested under
# `py/` would not reach `tools/`, and two configs would drift.
line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
# `dph_translator` is ours; without this it sorts as third-party from the `pocs/01_sketchup-export/` root, and the
# import block in every test file churns between the two layouts.
known-first-party = ["dph_translator"]
